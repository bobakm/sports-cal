name: Build and publish feeds

on:
  schedule:
    - cron: '0 */6 * * *'     # every 6 hours
  push:
    branches: [main]
  workflow_dispatch:           # manual "Run workflow" button

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Two guards, both of which fail the job and leave the previous
      # deployment serving rather than publishing something broken:
      #  - too few teams returned fixtures (near-empty feeds would make
      #    subscribers' calendars delete events they already have)
      #  - any feed fails RFC 5545 validation (a malformed feed is rejected
      #    outright by calendar apps, with no useful error for the subscriber)
      - run: npm run build
        env:
          SITE_BASE: ${{ vars.SITE_BASE || 'bobakm.github.io/sports-cal' }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
